name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Pokemon_Battle_Lab_Remake_v1.0.2_Android_Compatibility_Hardened.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract optimized source archive
        run: |
          test -s Pokemon_Battle_Lab_Remake_v1.0.2_Android_Compatibility_Hardened.zip
          unzip -q Pokemon_Battle_Lab_Remake_v1.0.2_Android_Compatibility_Hardened.zip -d .
          test -f Pokemon_Battle_Lab_Remake/project.godot
          test -f Pokemon_Battle_Lab_Remake/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Run release configuration guard
        working-directory: Pokemon_Battle_Lab_Remake
        run: python3 tests/release_guard.py

      - name: Validate project and GDScript
        working-directory: Pokemon_Battle_Lab_Remake
        run: godot --headless --editor --path . --quit

      - name: Run battle engine tests
        working-directory: Pokemon_Battle_Lab_Remake
        run: godot --headless --path . --script res://tests/test_battle_engine.gd

      - name: Run LAN network tests
        working-directory: Pokemon_Battle_Lab_Remake
        run: godot --headless --path . --script res://tests/test_lan_network.gd

      - name: Run authoritative LAN battle tests
        working-directory: Pokemon_Battle_Lab_Remake
        run: godot --headless --path . --script res://tests/test_net_battle_session.gd

      - name: Export Android APK
        working-directory: Pokemon_Battle_Lab_Remake
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/Pokemon_Battle_Lab_Remake-debug.apk
          test -s build/Pokemon_Battle_Lab_Remake-debug.apk

      - name: Verify APK metadata and signature
        run: |
          APK="Pokemon_Battle_Lab_Remake/build/Pokemon_Battle_Lab_Remake-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.pbl.remake'"
          echo "$BADGING" | grep -F "sdkVersion:'23'"
          echo "$BADGING" | grep -F "targetSdkVersion:'34'"
          echo "$BADGING" | grep -F "native-code: 'arm64-v8a' 'x86_64'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            APK="Pokemon_Battle_Lab_Remake/build/Pokemon_Battle_Lab_Remake-debug.apk"
            adb install -r "$APK"
            adb shell monkey -p com.pbl.remake 1
            for attempt in $(seq 1 20); do
              if adb shell pidof com.pbl.remake >/dev/null 2>&1; then
                echo "APK installed and application process started."
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -t 1200
            exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Battle-Lab-Remake-debug-APK
          path: Pokemon_Battle_Lab_Remake/build/Pokemon_Battle_Lab_Remake-debug.apk
          if-no-files-found: error
          retention-days: 14
